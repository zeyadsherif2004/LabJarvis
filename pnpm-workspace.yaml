packages:
  - apps/web

allowBuilds:
  esbuild: true
  protobufjs: false

# Transitive dependency overrides.
#
# Every entry resolves a published advisory in a build or test-only dependency.
# None of these packages are reachable from the shipped browser bundle, which
# contains only React and lucide-react. Overriding is preferred to bumping the
# direct dependencies because those are already current: the vulnerable copies
# arrive several levels down through eslint, vite, and jsdom, and would
# otherwise stay unfixable until each intermediate package releases.
#
# Re-check with: python scripts/tasks.py security
# Each replacement is pinned inside its own major. An unbounded target such as
# ">=1.1.18" lets pnpm satisfy a "^1.1.7" consumer with a 5.x release, which is a
# silent breaking substitution; carets keep every consumer on a compatible line.
overrides:
  brace-expansion@<2.0.0: "^1.1.18"
  brace-expansion@>=2.0.0 <3.0.0: "^2.0.3"
  brace-expansion@>=4.0.0: "^5.0.9"
  js-yaml@>=4.0.0 <5.0.0: "^4.3.1"
  nanoid@>=3.0.0 <4.0.0: "^3.3.18"
  postcss@>=8.0.0 <9.0.0: "^8.5.23"
  undici@>=7.0.0 <8.0.0: "^7.29.0"
