services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      LABJARVIS_APP_ENV: production
      LABJARVIS_MODEL_MODE: fake
      LABJARVIS_DATABASE_URL: sqlite+pysqlite:////data/labjarvis.db
      LABJARVIS_DATA_DIR: /data
      LABJARVIS_CORS_ORIGINS: '["http://127.0.0.1:8080"]'
    volumes:
      - labjarvis-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  labjarvis-data:
